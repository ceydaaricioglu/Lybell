# Supabase project config (Edge Functions)
# google-calendar-callback: Google OAuth redirect ile çağrılır, tarayıcıda JWT yok → verify_jwt kapalı
[functions.google-calendar-callback]
verify_jwt = false

# google-calendar-events: Ağ geçidi JWT 401 veriyorsa istek fonksiyona ulaşmıyor; token fonksiyon içinde getUser() ile doğrulanıyor
[functions.google-calendar-events]
verify_jwt = false

# google-calendar-sync-task: Pro – görev oluştur/güncelle/sil (JWT fonksiyon içinde doğrulanıyor)
[functions.google-calendar-sync-task]
verify_jwt = false

[functions.delete-account]
enabled = true
verify_jwt = true
import_map = "./functions/delete-account/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/delete-account/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/delete-account/*.html" ]
